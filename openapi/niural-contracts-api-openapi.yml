    get:
      tags:
      - Contracts
      summary: Get contracts
      description: 'Get a list of contracts

        '
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Number of items to fetch. Default is 20
      - name: next_cursor
        in: query
        required: false
        schema:
          type: string
        description: Get the next set of items from the cursor provided in the previous response if any
      - name: contract_type
        in: query
        required: false
        schema:
          type: string
        description: Filter by contract type
      - name: contractor_id
        in: query
        required: false
        schema:
          type: string
        description: Filter by contractor ID
      - name: contract_status
        in: query
        required: false
        schema:
          title: ContractStatus
          enum:
          - DRAFT
          - SIGNED_BY_EMPLOYER
          - CONTRACTOR_SIGN_PENDING
          - AMENDMENT_REQUESTED
          - ACTIVE
          - ENDING_SOON
          - ENDED
          - CANCELLED
          - INACTIVE
          type: string
        description: Filter by contract status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    title: ContractListResponse
                    properties:
                      items:
                        default: []
                        items:
                          title: ContractListResponseItem
                          properties:
                            contract_type:
