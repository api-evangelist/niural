  /contracts/{contract-id}/invite-contractor:
    patch:
      tags:
      - Contracts
      summary: Invite a Contractor to Sign a Contract
      description: 'Invite a contractor to sign a contract by contract ID

        '
      requestBody:
        content:
          application/json:
            schema:
              title: ContractorInvitationRequestModel
              properties:
                message_for_contractor:
                  default: null
                  description: Optional message to be sent to the contractor
                  example: Welcome to the team! Please review and sign the contract.
                  title: Message for Contractor
                  type:
                  - string
                  - 'null'
              type: object
        required: true
      parameters:
      - name: contract-id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the contract to send invitation for
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/paths/~1contracts~1%7Bcontract-id%7D~1sign/patch/responses/200/content/application~1json/schema/properties/data'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
