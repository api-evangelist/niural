                        title: Fee Breakdown
                        nullable: true
                        items:
                          title: Fee
                          properties:
                            fee_type:
                              default: null
                              nullable: true
                              title: TransactionFeeType
                              enum:
                              - ACH_PULL_PROCESSING_FEES
                              - WIRE_INCOMING_PROCESSING_FEES
                              - ON_RAMP_FEE
                              - OFF_RAMP_FEE
                              - CRYPTO_GAS_FEE
                              - ACH_OUTGOING_FEE
                              - WIRE_OUTGOING_FEE
                              - SWAP_FEE
