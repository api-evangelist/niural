                    type: string
                  description: The currency in which the invoice is issued
                  example: USD
                  title: Currency
                invoice_title:
                  description: The title of the invoice
                  example: Consulting Services Invoice
                  title: Invoice Title
                  type: string
                amount:
                  description: The total amount of the invoice
                  example: 1500
                  title: Amount
                  type: string
                cycle_start_date:
                  default: null
                  description: The start date of the billing cycle
                  example: '2023-01-01'
                  title: Cycle Start Date
                  nullable: true
                  format: date
                  type: string
                cycle_end_date:
                  default: null
                  description: The end date of the billing cycle
                  example: '2023-01-31'
                  title: Cycle End Date
                  nullable: true
                  format: date
                  type: string
                issued_date:
                  description: The date when the invoice was issued
                  example: '2023-02-01'
                  format: date
                  title: Issued Date
                  type: string
                due_date:
                  description: The date by which the invoice should be paid
                  example: '2023-02-15'
                  format: date
                  title: Due Date
                  type: string
                tags:
                  default: {}
                  description: Additional data you would like to provide on the resource.
                  example: {}
                  title: Tags
                  nullable: true
                  type: object
              required:
              - contract_id
              - currency
              - invoice_title
              - amount
              - issued_date
              - due_date
              type: object
      responses:
        '200':
          description: Invoice created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/paths/~1invoices/get/responses/200/content/application~1json/schema/properties/data'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
    get:
      summary: Get a list of invoices
      operationId: listInvoices
      tags:
      - Invoices
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Number of items to fetch. Default is 20
      - name: next_cursor
        in: query
        required: false
        schema:
          type: string
        description: Get the next set of items from the cursor provided in the previous response if any
      - name: contract_type
        in: query
        required: false
        schema:
          type: string
        description: Filter invoices by the type of contract
      - name: contract_id
        in: query
        required: false
        schema:
          type: string
        description: Filter invoices by the contract ID
      - name: invoice_status
        in: query
        required: false
        schema:
          title: InvoiceStatus
          enum:
          - DRAFT
          - UNDER_APPROVAL
          - PAYMENT_PENDING
          - OVERDUE
          - PAYMENT_PROCESSING
          - PAYMENT_FAILED
          - RECEIVED_BY_NIURAL
          - PAYOUT_PROCESSING
          - PAYOUT_FAILED
          - PAID
          - VOID
          - REJECTED
          type: string
        description: Filter invoices by their status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    title: InvoiceSingleResponse
                    properties:
                      invoice_id:
                        description: The unique identifier for the invoice
                        title: Invoice ID
                        type: string
                      currency:
                        anyOf:
                        - $ref: '#/paths/~1invoices/post/requestBody/content/application~1json/schema/properties/currency/anyOf/0'
                        - $ref: '#/paths/~1invoices/post/requestBody/content/application~1json/schema/properties/currency/anyOf/1'
                        description: The currency in which the invoice is issued
                        title: Currency
                      status:
                        $ref: '#/paths/~1invoices/get/parameters/4/schema'
                        description: The current status of the invoice
                        title: Status
                      total_amount:
                        description: The total amount of the invoice
                        title: Total Amount
                        type: string
                      issued_date:
                        description: The date when the invoice was issued
                        format: date
                        title: Issued Date
                        type: string
                      due_date:
                        description: The date by which the invoice should be paid
                        format: date
                        title: Due Date
                        type: string
                      invoice_items:
                        default: []
                        description: The list of items included in the invoice
                        items:
                          title: GeneralInvoiceItemDBModel
                          properties:
                            description:
                              title: Description
                              type: string
                            quantity:
                              default: 1
                              exclusiveMinimum: true
                              title: Quantity
                              type: number
                              minimum: 0
                            item_code:
                              default: null
                              nullable: true
                              title: InvoiceItemCode
                              enum:
                              - NIURAL_PLATFORM_FEE
                              - NIURAL_ARMOR_SECURITY_DEPOSIT
                              - SELF_CONTRACT
                              - NIURAL_CONTRACT
                              - NIURAL_ARMOR
                              - CONTRACT_CREATION_FEE
                              - EMPLOYER_OF_RECORD
                              - NIURAL_PAY_FEE
                              - BENEFIT_MASTER_INVOICE
                              - BACKGROUND_CHECK
                              - SIGNING_BONUS
                              - EOR_SECURITY_DEPOSIT
                              - EOR_SALES_TAX
                              - SUTA_TAX_RECONC
                              - FUTA_TAX_RECONC
                              - EXTRA_PAYMENT
                              - CREDIT_REDUCTION_TAX
                              - SDI_TAX
                              - PMFL_TAX
                              - EXPENSE_TAX
                              - PF_CONTRIBUTION
                              - EOR_EMPLOYEE_SALARY
                              - EOR_EMPLOYER_TAX
                              - EOR_ADDITIONAL_COMPENSATION
                              - EOR_FIXED_ALLOWANCES
                              - EOR_BENEFITS
                              - EOR_ADJUSTMENTS
                              - EOR_HEALTH_BENEFIT_MANAGEMENT_FEE
                              - EOR_RETIREMENT_BENEFITS_MANAGEMENT_FEE
                              - EOR_BENEFITS_MANAGEMENT_FEE
                              - EOR_EXPENSE
                              - PAY_ON_DEMAND
                              type: string
                            cost_per_unit:
                              title: Cost Per Unit
                              type: number
                            discount_per_unit:
                              default: 0
                              minimum: 0
                              title: Discount Per Unit
                              type: number
                            total_discount:
                              default: 0
                              minimum: 0
                              title: Total Discount
                              type: number
                            total_amount:
                              default: 0
                              minimum: 0
                              title: Total Amount
                              type: number
                            currency:
                              anyOf:
                              - $ref: '#/paths/~1invoices/post/requestBody/content/application~1json/schema/properties/currency/anyOf/0'
                              - $ref: '#/paths/~1invoices/post/requestBody/content/application~1json/schema/properties/currency/anyOf/1'
                              title: Currency
                            references:
                              default: []
                              title: References
                              nullable: true
                              items:
                                type: object
                              type: array
                            breakdown:
                              default: null
                              title: Breakdown
                              nullable: true
                              type: object
                            invoice_item_pdf:
                              default: null
                              nullable: true
                              $ref: '#/paths/~1contracts~1%7Bcontract-id%7D~1sign/patch/responses/200/content/application~1json/schema/properties/data/properties/contract_document'
                          required:
                          - description
                          - cost_per_unit
                          - currency
                          type: object
                        title: Invoice Items
                        type: array
                      payer_id:
                        description: The unique identifier for the payer
                        title: Payer ID
                        type: string
                      payer_name:
                        description: The name of the payer
                        title: Payer Name
                        type: string
                      payer_email:
                        description: The email address of the payer
                        format: email
                        title: Payer Email
                        type: string
                      payee_id:
                        default: null
                        description: The unique identifier for the payee
                        title: Payee ID
                        nullable: true
                        type: string
                      payee_name:
                        default: null
                        description: The name of the payee
                        title: Payee Name
                        nullable: true
                        type: string
                      payee_email:
                        default: null
                        description: The email address of the payee
                        title: Payee Email
                        nullable: true
                        format: email
                        type: string
                      invoice_title:
                        default: null
                        description: The title of the invoice
                        title: Invoice Title
                        nullable: true
                        type: string
                      contract_id:
                        default: null
                        description: The unique identifier for the contract
                        title: Contract ID
                        nullable: true
                        type: string
                      contractor_id:
                        default: null
                        description: The unique identifier for the contractor
                        title: Contractor ID
                        nullable: true
                        type: string
                      cycle_start_date:
                        default: null
                        description: The start date of the billing cycle
                        title: Cycle Start Date
                        nullable: true
                        format: date
                        type: string
                      cycle_end_date:
                        default: null
                        description: The end date of the billing cycle
                        title: Cycle End Date
                        nullable: true
                        format: date
                        type: string
                      tags:
                        default: {}
                        description: Additional data provided on the resource during creation.
                        example: {}
                        title: Tags
                        nullable: true
                        type: object
                    required:
                    - invoice_id
                    - currency
                    - status
                    - total_amount
                    - issued_date
                    - due_date
                    - payer_id
                    - payer_name
                    - payer_email
                    type: object
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
  /contracts/{contract-id}:
    get:
      tags:
      - Contracts
      summary: Get a Contract
      description: 'Get contract details by contract ID

        '
      parameters:
      - name: contract-id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the contract to retrieve
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                    - $ref: '#/paths/~1contracts~1%7Bcontract-id%7D~1sign/patch/responses/200/content/application~1json/schema/properties/data'
                    - title: GenericContractSingleResponse
                      properties:
                        contract_type:
                          description: Type of the contract
                          example: PAY_ON_DEMAND
                          title: Contract Type
                          enum:
                          - FIXED
                          - MILESTONE
                          - PAY_AS_YOU_GO
                          - EOR
                          - PAY_ON_DEMAND
                          type: string
                        contract_title:
                          description: Title of the contract
                          example: Software Development Contract
                          minLength: 2
                          title: Contract Title
                          type: string
                        contractor_type:
                          $ref: '#/paths/~1contracts/post/requestBody/content/application~1json/schema/oneOf/0/properties/contractor_type'
                          description: Type of the contractor
                          example: INDIVIDUAL
                          title: Contractor Type
                        contractor_first_name:
                          description: First name of the contractor
                          example: John
                          title: Contractor First Name
                          type: string
                        contractor_middle_name:
                          default: null
                          description: Middle name of the contractor
                          title: Contractor Middle Name
                          nullable: true
                          minLength: 0
                          type: string
                        contractor_last_name:
                          description: Last name of the contractor
                          example: Doe
                          title: Contractor Last Name
                          type: string
                        contractor_entity_name:
                          default: null
                          description: Entity name of the contractor if applicable
                          title: Contractor Entity Name
                          nullable: true
                          type: string
                        contractor_email:
                          description: Email address of the contractor
                          example: john.doe@example.com
                          format: email
                          title: Contractor Email
                          type: string
                        contractor_address:
                          $ref: '#/paths/~1contracts/post/requestBody/content/application~1json/schema/oneOf/0/properties/contractor_address'
                          description: Address of the contractor
                          example:
                            country:
                              iso2: US
                              name: United States
                            state:
                              iso2: NY
                              name: New York
                          title: Contractor Address
                        contractor_job_title:
                          description: Job title of the contractor
                          example: Software Developer
                          title: Contractor Job Title
                          type: string
                        scope_of_work:
                          description: Detailed description of the scope of work
                          example: Develop and maintain software applications.
                          maxLength: 10000
                          minLength: 0
                          title: Scope of Work
                          type: string
                        contractor_start_date:
                          default: null
                          description: Start date of the contract
                          example: '2023-01-01'
                          title: Contractor Start Date
                          nullable: true
                          format: date
                          type: string
                        contract_end_date:
                          default: null
                          description: End date of the contract
                          example: '2023-12-31'
                          title: Contract End Date
                          nullable: true
                          format: date
                          type: string
                        contract_id:
                          description: Unique identifier for the contract
                          title: Contract ID
                          type: string
                        contractor_id:
                          description: Unique identifier for the contractor
                          title: Contractor ID
                          type: string
                        contract_status:
                          $ref: '#/paths/~1contracts/get/parameters/4/schema'
                          description: Current status of the contract
                          title: Contract Status
                        employer_id:
                          description: Unique identifier for the employer
                          title: Employer ID
                          type: string
                        tags:
                          default: {}
                          description: Additional data provided on the resource during creation.
                          example: {}
                          title: Tags
                          nullable: true
                          type: object
                        contract_document:
                          default: null
                          description: Document associated with the contract
                          title: Contract Document
                          nullable: true
                          $ref: '#/paths/~1contracts~1%7Bcontract-id%7D~1sign/patch/responses/200/content/application~1json/schema/properties/data/properties/contract_document'
                      required:
                      - contract_type
                      - contract_title
                      - contractor_type
                      - contractor_first_name
                      - contractor_last_name
                      - contractor_email
                      - contractor_address
                      - contractor_job_title
                      - scope_of_work
                      - contract_id
                      - contractor_id
                      - contract_status
                      - employer_id
                      type: object
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServerErrorResponse'
  /contracts:
