                        title: Transaction ID
                        type: string
                      sub_total_amount:
                        description: The subtotal amount of the transaction before fees.
                        title: Sub Total Amount
                        type: string
                      fee_amount:
                        description: The total fee amount applied to the transaction.
                        title: Fee Amount
                        type: string
