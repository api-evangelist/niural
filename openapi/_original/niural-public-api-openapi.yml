openapi: 3.0.3
info:
  title: Niural Public API
  version: '1.0'
  description: The Niural Public API provides developers with access to Niural's core services, enabling
    seamless integration with third-party applications.
servers:
- url: https://api-sandbox.niural.com
  description: Sandbox environment
- url: https://api-live.niural.com
  description: Live environment
security:
- BearerAuth: []
paths:
  /invoices:
    post:
      summary: Create an invoice
      operationId: createInvoice
      tags:
      - Invoices
      requestBody:
        description: Invoice to be created
        required: true
        content:
          application/json:
            schema:
              title: InvoiceCreateRequest
              properties:
                contract_id:
                  description: The unique identifier for the contract
                  example: 123e4567-e89b-12d3-a456-426614174000
                  title: Contract ID
                  type: string
                currency:
