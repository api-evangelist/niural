aid: niural
name: Niural
description: >-
  Niural is a US-headquartered global workforce platform that unifies US payroll, PEO, employer of
  record (EOR), agent of record (AOR), contractor management and cross-border contractor payments in
  150+ countries inside a single system, with an AI layer (EMMA) that orchestrates payroll, compliance
  and expense approvals. Its public developer surface — the Niural Public API, documented on ReadMe at
  docs.niural.com — is narrower than the product: an OpenAPI 3.0.3 contract of 15 operations across
  four resources (authentication, pay-on-demand contractor contracts, invoices and transactions),
  served from separate sandbox and live hosts, authenticated with a client-credential exchange that
  returns a bearer JWT, with cursor pagination, a 25 requests/second rate limit, and three
  HMAC-SHA256-signed webhook events. Payroll, PEO, EOR and benefits are not exposed on the public API.
